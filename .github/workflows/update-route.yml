name: Update Road Route

on:
  schedule:
    - cron: '6 */6 * * *'   # every 6th hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run update-route
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}

      - name: Commit route if changed
        run: |
          git pull
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/route.json
          git diff --staged --quiet || git commit -m "autofix route data [skip ci]"
          git push
